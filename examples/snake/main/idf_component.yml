## IDF Component Manager Manifest File: the engine, the boards, and DGX-DI for the touch's gestures
dependencies:
  # the registry's; a checkout of the engine ($DGX_GE, else esp32-component-dgx-ge beside the editor's folder), a
  # component of the project (CMakeLists.txt), takes its place
  jef-sure/dgx-ge:
    version: "^0.5.0"
  # the hardware: the display, the touch, the sound of the board the build chose (sdkconfig.defaults.<board>); it
  # brings what that board needs (DGX-DI for a touch, the drivers of its sound) and nothing else
  jef-sure/boards: ">=0.0.5"
  # the game's own use of DGX-DI on every board: the gestures of the finger (dgx_di_touch_t) and the pad's layout
  jef-sure/dgx-di: "^0.1.5"
