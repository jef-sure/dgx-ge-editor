## IDF Component Manager Manifest File: the engine, and what the boards need beyond it
dependencies:
  jef-sure/dgx-ge:
    version: "*"
    # the folder of the engine: $DGX_GE (CMakeLists.txt sets it when it is not); a game of its own may take the
    # registry's instead, its version without this line
    override_path: "$DGX_GE"
  # the touch of a board: its fingers, the pad and the keyboard on the display
  jef-sure/dgx-di: "^0.1.2"
  # the CYD's resistive touch, the game's own (cyd_touch.c)
  atanisoft/esp_lcd_touch_xpt2046:
    version: "^1"
    rules:
      - if: "target == esp32"
  # the P4 boards' sound, an ES8311
  espressif/esp_codec_dev:
    version: "~1.6.2"
    rules:
      - if: "target == esp32p4"
  # the 7"'s touch panel, a GT911
  espressif/esp_lcd_touch_gt911:
    version: "^1"
    rules:
      - if: "target == esp32p4"
